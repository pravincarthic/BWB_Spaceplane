%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2-NEMO 8.2.0 configuration                                                 %
% Steady, 7-species air, two-temperature nonequilibrium                        %
% Mach 10 viscous flow, 480-core MPI                                           %
%                                                                              %
% AoA is already -5 in the mesh file                                            %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------------------- PROBLEM DEFINITION -------------------------------%
%
SOLVER= NEMO_NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
AXISYMMETRIC= NO

% ------------------------- FREESTREAM DEFINITION ----------------------------%
%
MACH_NUMBER= 10.0
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 292.12
FREESTREAM_TEMPERATURE= 250
FREESTREAM_TEMPERATURE_VE= 250
INIT_OPTION= TD_CONDITIONS

% ------------------------- NONEQUILIBRIUM GAS MODEL -------------------------%
%
FLUID_MODEL= SU2_NONEQ
GAS_MODEL= AIR-7
TRANSPORT_COEFF_MODEL= GUPTA-YOS
GAS_COMPOSITION= (0.767, 0.23, 0.001, 0.001, 0.0009999999, 5E-13, 5E-13)

% ------------------------- BOUNDARY CONDITIONS ------------------------------%
%
MARKER_ISOTHERMAL= ( Solid_Walls, 1500.0 )
MARKER_FAR= ( Atmosphere, Inlet, Outlet )
MARKER_SYM= ( NONE )
MARKER_PLOTTING= ( Solid_Walls )
MARKER_MONITORING= ( Solid_Walls )

% ------------------------- REFERENCE VALUES ---------------------------------%
%
REF_ORIGIN_MOMENT_X= 25.717
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 3.022
REF_AREA= 912.1
REF_LENGTH= 48.061
REF_DIMENSIONALIZATION= DIMENSIONAL

% ------------------------- NUMERICAL METHOD ---------------------------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= SLAU2
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NISHIKAWA_R5
VENKAT_LIMITER_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT

% ------------------------- CFL AND RAMPING ----------------------------------%
%
% Start low so the shock can establish, then ramp. A cold start at CFL 0.8 on a y+ under 1 mesh at Mach 10 frequently diverges in the first few hundred iterations.
CFL_NUMBER= 0.4
%CFL_RAMP_FACTOR= 1.05
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.1, 0.2, 15.0 )
%MAX_CFL_NUMBER= 25.0
ITER= 15000

% ------------------------- LINEAR SOLVER ------------------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 1
LINEAR_SOLVER_ERROR= 1E-5
LINEAR_SOLVER_ITER= 25

% ------------------------- CONVERGENCE -------------------------------------%
%
CONV_FIELD= RMS_DENSITY_0
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 100
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-10

% ------------------------- INPUT AND OUTPUT ---------------------------------%
%
MESH_FILENAME= Mesh_with_cavities_AoA_neg5_20260908.su2
MESH_FORMAT= SU2

SOLUTION_FILENAME= restart_flow.dat
RESTART_FILENAME= restart_flow.dat
TABULAR_FORMAT= CSV
CONV_FILENAME= history
VOLUME_FILENAME= soln_volume
SURFACE_FILENAME= soln_surface

OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW )
OUTPUT_WRT_FREQ= 50
WRT_RESTART_FREQ= 1000
WRT_FORCES_BREAKDOWN= YES

VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, AUXILIARY )

SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY_0, RMS_ENERGY, RMS_ENERGY_VE, \
                 LINSOL_ITER, CFL_NUMBER, LIFT, DRAG, TOTAL_HEATFLUX )

